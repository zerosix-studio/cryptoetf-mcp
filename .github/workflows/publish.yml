name: Publish to npm

# Публикация по тегу: `git tag v1.0.4 && git push --tags`.
# Версия берётся из package.json, тег нужен только как отметка релиза —
# так в истории репозитория видно, какой коммит уехал в реестр.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Публикация зеркала в GitHub Packages — ради блока Packages на странице
      # репозитория: npmjs туда не попадает, только собственный реестр GitHub.
      packages: write
      # Без id-token публикация пройдёт, но без provenance: именно этот токен
      # позволяет npm подписать пакет и показать на его странице ссылку на
      # workflow-run и коммит, из которых он собран.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check the bridge starts and reaches the server
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node bin/cli.mjs | tee /tmp/out.jsonl
          grep -q '"get_flows_summary"' /tmp/out.jsonl

      - name: Skip if this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already in the registry — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Тот же тарбол во внутренний реестр GitHub. Ставить оттуда неудобно —
      # он требует авторизации даже к публичному пакету, — но именно эта
      # публикация заполняет блок Packages в сайдбаре репозитория.
      #
      # Учётные данные пишем прямо в ~/.npmrc: setup-node настроил его под
      # npmjs, и для второго реестра NODE_AUTH_TOKEN не подхватывается —
      # публикация падала с ENEEDAUTH.
      - name: Mirror to GitHub Packages
        if: steps.check.outputs.already == 'false'
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com
