name: Publish to npm

# Releasing is tagging: `git tag v1.0.4 && git push --tags`.
# The version comes from package.json; the tag only marks the release, so the
# repository history shows which commit went to the registry.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the GitHub Packages mirror, which fills the Packages block on the
      # repository page: npmjs never shows up there, only GitHub's own registry.
      packages: write
      # Without id-token the publish still works, but without provenance: this
      # token is what lets npm sign the package and link its page back to the
      # workflow run and the commit the tarball was built from.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check the bridge starts and reaches the server
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node bin/cli.mjs | tee /tmp/out.jsonl
          grep -q '"get_flows_summary"' /tmp/out.jsonl

      - name: Skip if this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already in the registry — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The same tarball into GitHub's registry. Installing from it is awkward —
      # it asks for authentication even for a public package — but this publish
      # is what fills the Packages block in the repository sidebar.
      #
      # A second setup-node rather than editing .npmrc by hand: it points npm at
      # its own config through NPM_CONFIG_USERCONFIG, so appending lines to the
      # file was never read and the mirror kept dying with ENEEDAUTH.
      - uses: actions/setup-node@v4
        if: steps.check.outputs.already == 'false'
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@zerosix-studio'

      - name: Mirror to GitHub Packages
        if: steps.check.outputs.already == 'false'
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
